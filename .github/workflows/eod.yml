name: eod
on:
  schedule:
    - cron: "30 10 * * 1-5"   # 16:00 IST
  workflow_dispatch:
concurrency: {group: trader-state, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  eod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with: {path: data_cache, key: "bars-${{ github.run_id }}", restore-keys: "bars-"}
      - name: Upstox token (TOTP, automatic)
        # Fresh token every run (they expire 03:30 IST). Needs secrets UPSTOX_API_KEY, UPSTOX_PIN,
        # UPSTOX_TOTP_SECRET; without them (--optional) the UPSTOX_ACCESS_TOKEN secret is used.
        run: python scripts/upstox_token.py --github-env --check --optional
        env:
          UPSTOX_API_KEY: "${{ secrets.UPSTOX_API_KEY }}"
          UPSTOX_PIN: "${{ secrets.UPSTOX_PIN }}"
          UPSTOX_TOTP_SECRET: "${{ secrets.UPSTOX_TOTP_SECRET }}"
      - run: python -m trader eod
        # exits 2 on a rejected token, 3 on stale data -> this run fails (GitHub emails you) and
        # the commit step below is skipped, so no stale state is pushed
        env: {UPSTOX_ACCESS_TOKEN: "${{ env.UPSTOX_ACCESS_TOKEN || secrets.UPSTOX_ACCESS_TOKEN }}"}
      - name: Run summary
        if: always()
        run: python scripts/run_summary.py eod >> "$GITHUB_STEP_SUMMARY"
      - run: |
          git config user.name "wrsi-bot"; git config user.email "bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "eod $(date -u +%F)" && git pull --rebase --autostash && git push)
